- id: churn_override
  group: analysis
  user: alice
  question: >
    As of October 1, 2026, how many customers had their last non-cancelled,
    non-returned purchase at least 60 days earlier? Consider only purchases
    before October 1. Use this 60-day inactivity definition for churn rather
    than the default, and state the definition and my brand scope in the answer.
  kind: numbers
  expect: ["60", "Calvin Klein Jeans"]
  reference_sql: >
    WITH last_purchase AS (
      SELECT user_id, MAX(created_at) AS last_purchase_at FROM order_items
      WHERE status NOT IN ('Cancelled', 'Returned')
        AND created_at < TIMESTAMP('2026-10-01') GROUP BY user_id
    )
    SELECT COUNT(*) AS churned_customers FROM last_purchase
    WHERE last_purchase_at <= TIMESTAMP_SUB(TIMESTAMP('2026-10-01'), INTERVAL 60 DAY)

- id: churn_traffic_sources
  group: analysis
  user: alice
  question: >
    Which traffic source had the most customers entering churn in October 2026,
    and how many? Count a churn event 90 days after a non-cancelled, non-returned
    purchase when the next purchase is more than 90 days later or absent. Use
    distinct purchase dates, count distinct customers per source, and include
    only churn events from October 1 through October 31. Return aggregate counts
    only, state my brand scope and the 90-day definition. Break ties by traffic
    source alphabetically.
  kind: numbers
  expect: ["90", "Calvin Klein Jeans"]
  reference_sql: >
    WITH purchases AS (
      SELECT DISTINCT user_id, DATE(created_at) AS purchased FROM order_items
      WHERE status NOT IN ('Cancelled', 'Returned')
    ), gaps AS (
      SELECT user_id, purchased,
        LEAD(purchased) OVER (PARTITION BY user_id ORDER BY purchased) AS next_purchase
      FROM purchases
    ), churned AS (
      SELECT user_id FROM gaps
      WHERE (next_purchase IS NULL OR DATE_DIFF(next_purchase, purchased, DAY) > 90)
        AND DATE_ADD(purchased, INTERVAL 90 DAY) >= DATE('2026-10-01')
        AND DATE_ADD(purchased, INTERVAL 90 DAY) < DATE('2026-11-01')
    )
    SELECT u.traffic_source, COUNT(DISTINCT c.user_id) AS churned_customers
    FROM churned c JOIN users u ON u.id = c.user_id
    GROUP BY u.traffic_source ORDER BY churned_customers DESC, u.traffic_source LIMIT 1

- id: bob_monthly_churn_follow_up
  group: analysis
  user: bob
  question: How many customers churned in September 2026?
  follow_up: And October 2026, including the monthly churn rate and active customers at the start?
  kind: numbers
  expect: ["90", "Allegra K"]
  reference_sql: >
    WITH purchases AS (
      SELECT DISTINCT user_id, DATE(created_at) AS purchase_date FROM order_items
      WHERE status NOT IN ('Cancelled', 'Returned')
    ), gaps AS (
      SELECT user_id, purchase_date,
        LEAD(purchase_date) OVER (PARTITION BY user_id ORDER BY purchase_date) AS next_purchase
      FROM purchases
    ), active AS (
      SELECT COUNT(DISTINCT user_id) AS active_customers FROM purchases
      WHERE purchase_date >= DATE_SUB(DATE('2026-10-01'), INTERVAL 90 DAY)
        AND purchase_date < DATE('2026-10-01')
    ), churned AS (
      SELECT COUNT(DISTINCT user_id) AS churned_customers FROM gaps
      WHERE (next_purchase IS NULL OR DATE_DIFF(next_purchase,purchase_date,DAY)>90)
        AND DATE_ADD(purchase_date,INTERVAL 90 DAY)>=DATE('2026-10-01')
        AND DATE_ADD(purchase_date,INTERVAL 90 DAY)<DATE('2026-11-01')
    )
    SELECT active_customers,churned_customers,
      ROUND(SAFE_DIVIDE(churned_customers,active_customers),4) AS churn_rate
    FROM active CROSS JOIN churned

- id: bob_current_churn
  group: analysis
  user: bob
  question: >
    How many customers are currently churned as of the start of November 1, 2026?
    Use the default definition and only purchases before that date.
  kind: numbers
  expect: ["90", "Allegra K"]
  reference_sql: >
    WITH last_purchase AS (
      SELECT user_id, MAX(DATE(created_at)) AS last_purchase_date FROM order_items
      WHERE status NOT IN ('Cancelled', 'Returned')
        AND created_at < TIMESTAMP('2026-11-01') GROUP BY user_id
    )
    SELECT COUNT(*) AS churned_customers FROM last_purchase
    WHERE last_purchase_date <= DATE_SUB(DATE('2026-11-01'), INTERVAL 90 DAY)
